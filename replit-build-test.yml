name: Replit Prototype Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - replit-visual-optimisation-2026-09-26
    paths:
      - "replit-prototype/**"
      - ".github/workflows/replit-build-test.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: replit-prototype

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build ForgeLogic prototype
        run: npm run build
